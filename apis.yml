aid: gbg

name: GBG

description: GBG (gbgplc.com, which also runs investor relations pages) is an identity verification, location intelligence and fraud prevention
  company. Its site describes solutions that help organisations quickly validate and verify the identity and location of their customers. Developers
  integrate through the GBG GO identity verification platform, whose documented REST API covers access tokens, starting customer journeys, retrieving
  and submitting tasks, and fetching journey state.

