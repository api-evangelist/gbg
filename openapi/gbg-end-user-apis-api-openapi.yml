openapi: 3.2.0
info:
  title: GBG GO Next Gen Flow Captain End User APIs API
  version: 1.0.0
  description: API for Customers and End Users to interact with the GBG GO Next Gen Flow Captain
  contact:
    name: GBG GO Next Generation Flow Captain API Team
    url: https://gbgplc.com
    email: customer.support@gbg.com
servers:
- url: https://eu.platform.go.gbgplc.com/v2/captain
- url: https://us.platform.go.gbgplc.com/v2/captain
- url: https://au.platform.go.gbgplc.com/v2/captain
tags:
- name: End User APIs
paths:
  /journey/device/connect:
    post:
      operationId: deviceConnect
      summary: Connect or Refresh End User Device
      tags:
      - End User APIs
      security:
      - DeviceConnect: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                connectToken:
                  type: string
                  minLength: 8
                  maxLength: 1024
                  pattern: ^[A-Za-z0-9-_]+$
                  description: Bearer Token credential for a connection.
                deviceInfo:
                  type: object
                  properties:
                    deviceId:
                      type: string
                      minLength: 16
                      maxLength: 64
                      description: Device Id, a unique identifier for a device.
                    deviceName:
                      type: string
                    deviceType:
                      type: string
                  required:
                  - deviceId
                  additionalProperties: false
              required:
              - connectToken
              - deviceInfo
              additionalProperties: false
            example:
              deviceInfo:
                deviceId: exampleDeviceId123
                deviceName: deviceName
                deviceType: deviceType
              connectToken: s4FUx8Ny8ijXRtFigz3x1_8rb9bd_5ZD
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  endUserToken:
                    type: string
                    minLength: 8
                    maxLength: 1024
                    pattern: ^[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+$
                    description: Token used for subsequent operations by the client
                  tokenType:
                    type: string
                    enum:
                    - Bearer
                    - DPoP
                    - N_A
                    - end-user
                    default: Bearer
                  expiresIn:
                    type: number
                    description: Seconds until the token expires
                    exclusiveMinimum: 0
                required:
                - expiresIn
                additionalProperties: false
              examples:
                Default:
                  value:
                    endUserToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ8.eyJqdGkiOiJsRzlsZnZTVFVrcGNTTkVmSWx3amZXT1JRMkJwZEhGcCIsInNjb3BlIjpbImRlbW8zNCIsImF1dGgiXSwiaWF0IjoxNzEyMDc1OTMwLCJleHAiOjE3MTIwNzk1MzAsImF1ZCI6InVzLWVhc3QtMS5nYmdnby5jb20vI2RldmljZSJ9.Adn32WkNlhAlyFyHLH9EEVvFHk-FIhQn9Wiphb_BTRI
                    tokenType: end-user
                    expiresIn: 3600
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  endUserToken:
                    type: string
                    minLength: 8
                    maxLength: 1024
                    pattern: ^[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+$
                    description: Token used for subsequent operations by the client
                  tokenType:
                    type: string
                    enum:
                    - Bearer
                    - DPoP
                    - N_A
                    - end-user
                    default: Bearer
                  expiresIn:
                    type: number
                    description: Seconds until the token expires
                    exclusiveMinimum: 0
                required:
                - expiresIn
                additionalProperties: false
              examples:
                Default:
                  value:
                    endUserToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ8.eyJqdGkiOiJsRzlsZnZTVFVrcGNTTkVmSWx3amZXT1JRMkJwZEhGcCIsInNjb3BlIjpbImRlbW8zNCIsImF1dGgiXSwiaWF0IjoxNzEyMDc1OTMwLCJleHAiOjE3MTIwNzk1MzAsImF1ZCI6InVzLWVhc3QtMS5nYmdnby5jb20vI2RldmljZSJ9.Adn32WkNlhAlyFyHLH9EEVvFHk-FIhQn9Wiphb_BTRI
                    tokenType: end-user
                    expiresIn: 3600
        '400':
          description: Bad Request
          content:
            application/json: {}
        '401':
          description: Unauthorized
          content:
            application/json: {}
        '403':
          description: Forbidden
          content:
            application/json: {}
        '404':
          description: Not Found
          content:
            application/json: {}
        '405':
          description: Method Not Allowed
          content:
            application/json: {}
        '500':
          description: Internal Server Error
          content:
            application/json: {}
        '503':
          description: Service Unavailable
          content:
            application/json: {}
  /journey/task/list:
    post:
      operationId: getTasks
      summary: Get End User Tasks
      tags:
      - End User APIs
      security:
      - PingID: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                instanceId:
                  type: string
                  minLength: 16
                  maxLength: 64
                  description: Journey Instance Id, a unique identifier for a started journey instance.
              required:
              - instanceId
              additionalProperties: true
            example:
              instanceId: PiIuACmx8Q8R7qPnAkLAqBAT
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  instanceId:
                    type: string
                    minLength: 16
                    maxLength: 64
                    description: Journey Instance Id, a unique identifier for a started journey instance.
                  status:
                    type: string
                    enum:
                    - Completed
                    - InProgress
                    - Failed
                    - Paused
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        taskId:
                          type: string
                          minLength: 16
                          maxLength: 64
                          description: Task Id, a unique identifier for a task assigned to an End User during a Journey.
                      required:
                      - taskId
                      additionalProperties: false
                required:
                - instanceId
                - status
                - tasks
                additionalProperties: false
              examples:
                Default:
                  value:
                    status: InProgress
                    instanceId: PiIuACmx8Q8R7qPnAkLAqBAT
                    tasks:
                    - taskId: TkoviRO58Q8R7qPnAkLAqBAT
        '400':
          description: Bad Request
          content:
            application/json: {}
        '401':
          description: Unauthorized
          content:
            application/json: {}
        '403':
          description: Forbidden
          content:
            application/json: {}
        '404':
          description: Not Found
          content:
            application/json: {}
        '405':
          description: Method Not Allowed
          content:
            application/json: {}
        '500':
          description: Internal Server Error
          content:
            application/json: {}
        '503':
          description: Service Unavailable
          content:
            application/json: {}
