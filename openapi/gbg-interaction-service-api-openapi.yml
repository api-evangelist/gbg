openapi: 3.2.0
info:
  title: GBG GO Next Gen Flow Captain Interaction Service API
  version: 1.0.0
  description: API for Customers and End Users to interact with the GBG GO Next Gen Flow Captain
  contact:
    name: GBG GO Next Generation Flow Captain API Team
    url: https://gbgplc.com
    email: customer.support@gbg.com
servers:
- url: https://eu.platform.go.gbgplc.com/v2/captain
- url: https://us.platform.go.gbgplc.com/v2/captain
- url: https://au.platform.go.gbgplc.com/v2/captain
tags:
- name: Interaction Service
paths:
  /journey/interaction/submit:
    post:
      operationId: submitInteraction
      summary: Submit Interaction
      tags:
      - Interaction Service
      security:
      - InteractionAccess: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                instanceId:
                  type: string
                  description: Journey instance identifier
                interactionId:
                  type: string
                  description: Interaction identifier
                participants:
                  type: array
                  items:
                    type: object
                    properties:
                      domainElementId:
                        type: string
                        description: Optional domain element identifier
                      instruction:
                        type: string
                    additionalProperties: false
                  description: List of participant identifiers involved in the interaction
                context:
                  type: object
                  properties:
                    subject:
                      type: object
                      properties:
                        identity:
                          type: object
                          properties:
                            title:
                              type: string
                              description: Title of an individual such as Mr, Mrs, Dr, Sir
                            firstName:
                              type: string
                              description: A person's name used by their collegues and friends to address them
                            middleNames:
                              type: array
                              items:
                                type: string
                              description: Any other registered names used by the individual, not aliases
                            lastNames:
                              type: array
                              items:
                                type: string
                              description: Any family names for the individual
                            lastNamesAtBirth:
                              type: array
                              items:
                                type: string
                              description: Any family names for the individual
                            aliases:
                              type: array
                              items:
                                type: object
                                properties:
                                  title:
                                    type: string
                                    description: Title of an individual such as Mr, Mrs, Dr, Sir
                                  firstName:
                                    type: string
                                    description: A person's name used by their collegues and friends to address them
                                  middleNames:
                                    type: array
                                    items:
                                      type: string
                                    description: Any other registered names used by the individual, not aliases
                                  lastNames:
                                    type: array
                                    items:
                                      type: string
                                    description: Any family names for the individual
                                  lastNamesAtBirth:
                                    type: array
                                    items:
                                      type: string
                                    description: Any family names for the individual
                                additionalProperties: false
                            relatedPersons:
                              type: array
                              items:
                                type: object
                                properties:
                                  title:
                                    type: string
                                    description: Title of an individual such as Mr, Mrs, Dr, Sir
                                  firstName:
                                    type: string
                                    description: A person's name used by their collegues and friends to address them
                                  middleNames:
                                    type: array
                                    items:
                                      type: string
                                    description: Any other registered names used by the individual, not aliases
                                  lastNames:
                                    type: array
                                    items:
                                      type: string
                                    description: Any family names for the individual
                                  lastNamesAtBirth:
                                    type: array
                                    items:
                                      type: string
                                    description: Any family names for the individual
                                  relationship:
                                    type: string
                                    enum:
                                    - mother
                                    - father
                                    - maternalGrandFather
                                    - maternalGrandMother
                                    - paternalGrandFather
                                    - paternalGrandMother
                                required:
                                - relationship
                                additionalProperties: false
                            dateOfBirth:
                              type: string
                              pattern: ^\d{4}-\d{2}-\d{2}$
                              description: Specified in year, month and day separated by -.  For example 2017-1-1 or 2017-01-01 which conforms to ISO 8601
                            gender:
                              type: string
                            currentAddress:
                              type: object
                              properties:
                                lines:
                                  type: array
                                  items:
                                    type: string
                                  description: Unformatted line based address
                                addressString:
                                  type: string
                                  description: The address as a single line
                                premise:
                                  type: string
                                  description: 'The primary delivery point for a premise or building. This could be a house number, a building name, etc. '
                                building:
                                  type: string
                                  description: The name of a building or a building complex. In the US, this is the street number.
                                subBuilding:
                                  type: string
                                  description: The name of a sub-building, such as a flat or apartment number.
                                thoroughfare:
                                  type: string
                                  description: This field holds the most common street or block data element within a country. For instance, USA Street
                                dependentThoroughfare:
                                  type: string
                                  description: The name of a dependent street or block, such as a street within a complex.
                                locality:
                                  type: string
                                  description: This field holds the most common population center data element within a country. For instance, USA City, Canadian Municipality
                                dependentLocality:
                                  type: string
                                  description: This is a smaller area within a locality, such as a neighborhood or district. Like Manhattan in New York City, or Soho in London.
                                doubleDependentLocality:
                                  type: string
                                  description: This is an even smaller area within a dependent locality, often used in very detailed addresses.
                                postalCode:
                                  type: string
                                  description: This field contains the complete postal code for a particular delivery point, should such detail be able to be determined. For example ZIP code in the US
                                postBox:
                                  type: string
                                  description: This field contains the post box number associated with a particular delivery point, should one exist.
                                country:
                                  type: string
                                  pattern: ^[A-Z]{2,3}$
                                  description: Country the address is in. It must be a valid ISO2 or ISO3 country code
                                superAdministrativeArea:
                                  type: string
                                administrativeArea:
                                  type: string
                                subAdministrativeArea:
                                  type: string
                                organization:
                                  type: string
                                location:
                                  type: object
                                  properties:
                                    latitude:
