info:
  title: Gbg Journey API
  license:
    name: MIT
  version: '1.0'
  description: 'Operations tagged Journey across 3 of this provider''s published API definitions: gbg-go-v2-openapi.json, gbg-go-v1-openapi.yml, gbg-go-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://eu.platform.go.gbgplc.com/v2/captain/
- url: https://us.platform.go.gbgplc.com/v2/captain/
- url: https://au.platform.go.gbgplc.com/v2/captain/
- url: https://api.auth.gbgplc.com/as/token.oauth2
- url: https://eu.platform.go.gbgplc.com/captain/api
- url: https://us.platform.go.gbgplc.com/captain/api
- url: https://au.platform.go.gbgplc.com/captain/api
tags:
- name: Journey
paths:
  /journey/start:
    post:
      tags:
      - Journey
      summary: Start a new journey
      description: Creates a new journey instance from a resource definition.
      security:
      - CustomerAccess: []
      requestBody:
        content:
