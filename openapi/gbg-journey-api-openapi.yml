  /journey/state/fetch:
    post:
      tags:
      - Journey
      summary: Fetch journey state
      description: Retrieves the current state of a journey instance.
      security:
      - CustomerAccess: []
      parameters:
      - schema:
          type: string
          description: Response profile. Omit or 'full' for the full response (default, unchanged). 'slim' returns the compact, typed customer-facing shape. Any other value returns 400.
          example: slim
        required: false
        description: Response profile. Omit or 'full' for the full response (default, unchanged). 'slim' returns the compact, typed customer-facing shape. Any other value returns 400.
        name: view
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                instanceId:
                  type: string
                  minLength: 16
                  maxLength: 64
                  pattern: ^[A-Za-z0-9_-]+$
                  description: Journey Instance Id, a unique identifier for a started journey instance.
              required:
              - instanceId
              additionalProperties: {}
      responses:
        '200':
          description: Journey state (full by default; slim with ?view=slim)
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/StateFetchResponse'
                - $ref: '#/components/schemas/SlimStateFetchResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Journey not found
          content:
