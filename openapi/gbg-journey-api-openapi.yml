                              type: string
                              minLength: 1
                              description: A person's name used by their collegues and friends to address them
                            middleNames:
                              type: array
                              items:
                                type: string
                                minLength: 1
                              description: Any other registered names used by the individual, not aliases
                            lastNames:
                              type: array
                              items:
                                type: string
                                minLength: 1
                              minItems: 1
                              description: Any family names for the individual
                            lastNamesAtBirth:
                              type: array
                              items:
                                type: string
                                minLength: 1
                              minItems: 1
                              description: Any family names for the individual
                            aliases:
