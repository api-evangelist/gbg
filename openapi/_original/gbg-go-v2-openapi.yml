    SlimResult:
      type: object
      properties:
        outcome:
          type: string
        status:
          type: string
          enum:
          - pending
          - complete
          - error
          - timeout
          description: 'Headline result state, and the AUTHORITATIVE signal for whether the journey succeeded. `complete` means the journey finished. `error` means it ended in failure: either a module reported a terminal error, or the platform abandoned the journey before it could finish (a deadlock, an interaction or execution timeout, or a spin). Abandonment is reported as `error` rather than as a distinct value. `pending` is reported for a running journey once its state has materialized. `timeout` is part of this range but is not currently emitted at journey level — an elapsed deadline surfaces as `error`. When `status` disagrees with `outcome` or `outcomeClassification`, `status` wins: a journey can pass an evaluation and then fail before finishing, leaving a positive classification beside `status: "error"`. Both are true — the evaluation did pass — but the journey did not complete, so do not read a positive classification as success. Note also that an `error` caused by abandonment is
            generally NOT retryable — a deadlocked journey deadlocks again — even though the accompanying error advises a retry; start a new journey instead.'
        outcomeClassification:
          type:
          - string
          - 'null'
          enum:
          - positive
          - negative
          - neutral
          - null
        errors:
          type: array
          items:
            $ref: '#/components/schemas/GbgError'
          minItems: 1
        data:
          $ref: '#/components/schemas/SlimVerifiedData'
    SlimVerifiedData:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/SlimIdentity'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/SlimDocument'
      description: 'Verified-output slice (OQ-A). May be transiently ABSENT on a journey already reporting `status: complete`: the certified view materializes just after the completion signal, so a client reading `data` the instant it sees `complete` may need to re-poll once. Absent `data` means "not yet available", not "no verified data". (Read-after-write closure tracked in GGO-16738.)'
