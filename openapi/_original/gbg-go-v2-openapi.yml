  /journey/interaction/fetch:
    post:
      tags:
      - Interaction
      summary: Fetch current interaction
      description: Retrieves the current interaction state for a journey instance.
      security:
      - CustomerAccess: []
      - InteractionAccess: []
      parameters:
      - schema:
          type: string
          description: Response profile. Omit or 'full' for the full response (default, unchanged). 'slim' returns the compact, typed customer-facing shape. Any other value returns 400.
          example: slim
        required: false
        description: Response profile. Omit or 'full' for the full response (default, unchanged). 'slim' returns the compact, typed customer-facing shape. Any other value returns 400.
        name: view
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                instanceId:
                  type: string
                  minLength: 16
                  maxLength: 64
                  pattern: ^[A-Za-z0-9_-]+$
                  description: Journey Instance Id, a unique identifier for a started journey instance.
                scope:
                  type: string
                  enum:
                  - subject
                  - reviewer
              required:
              - instanceId
              additionalProperties: {}
      responses:
        '200':
          description: Interaction state (full by default; slim with ?view=slim)
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/InteractionFetchResponse'
                - $ref: '#/components/schemas/SlimInteractionFetchResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Instance not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /journey/interaction/submit:
    post:
      tags:
      - Interaction
      summary: Submit interaction data
      description: Submits participant data for an interaction.
      security:
      - CustomerAccess: []
      - InteractionAccess: []
      requestBody:
        content:
          application/json:
