              - $ref: '#/components/schemas/PasswordGrantRequest'
              discriminator:
                propertyName: grant_type
                mapping:
                  client_credentials: '#/components/schemas/ClientCredentialsGrantRequest'
                  password: '#/components/schemas/PasswordGrantRequest'
      responses:
        '200':
          description: Successfully retrieved access token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: The access token used for authentication.
                  expires_in:
                    type: integer
                    description: Token expiration time in seconds.
                  token_type:
                    type: string
                    description: The type of token, usually 'Bearer'.
        '400':
          description: Invalid request. Check your credentials.
        '401':
          description: Unauthorized request. Invalid client or user credentials.
      tags:
      - Authentication
