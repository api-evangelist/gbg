            building:
              type: string
              description: The name of the building, complex, or named property — "Landmark House", "The Shard". Never the street number, in any country; that is premise. A property identified only by a name populates this field with premise left empty.
            subBuilding:
              type: string
              description: The unit within the property, such as a flat, apartment or suite number — "FLAT 1", "SUITE 212".
            thoroughfare:
              type: string
              description: This field holds the most common street or block data element within a country. For instance, USA Street
