  /journey/interaction/asset/upload:
    post:
      tags:
      - Interaction
      summary: Stream an interaction asset to storage
      description: 'Streams a raw asset body (application/octet-stream) to storage and returns its gofs key. Identifiers are passed as X-Instance-Id, X-Interaction-Id and X-Domain-Element-Id headers. Accepts capture elements: the encrypted selfie (EncryptedSelfie/selfieImage), the plain selfie (Selfie/selfieImage), and both document sides (PrimaryDocument/side1Image, PrimaryDocument/side2Image). An element the current deployment does not accept returns 422 — submit that asset inline (base64) in the interaction submit instead.'
      security:
      - CustomerAccess: []
      - InteractionAccess: []
      responses:
        '200':
          description: Asset stored; returns the gofs key to reference in the subsequent submit
          content:
            application/json:
              schema:
                type: object
                properties:
                  domainElementId:
                    type: string
                  gofsKey:
                    type: string
                required:
                - domainElementId
                - gofsKey
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Element is not being collected by the current interaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Asset too large or unsupported element
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests for this journey instance, or the element has been uploaded the maximum number of times for this journey (retry after Retry-After)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Asset storage unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /journey/instance/{instanceId}/handoff-token:
    post:
      tags:
      - Interaction
      summary: Mint a fresh position-scoped handoff token
      description: Mints a fresh page-mode delivery-token + connect-secret pair pointing at the same instance, stamped devicePosition=joined, so a second device can join. Device-token only, and only from the device that started the journey; customer tokens and already-joined devices are rejected with 403. Returns { instanceUrl, devicePosition, expiresIn }.
      security:
      - InteractionAccess: []
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: instanceId
        in: path
      responses:
        '201':
          description: Fresh handoff token minted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffTokenResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — caller is not the originating device (customer token or joined handoff device)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Instance not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable — connect-secret service or state store not wired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /journey/loqate/search:
    post:
      tags:
      - Interaction
      summary: Search addresses via Loqate Capture
      description: Server-side proxy for the Loqate Capture Find endpoint. Returns address suggestions for a free-text query; the Loqate API key is held server-side and never reaches the browser.
      security:
      - CustomerAccess: []
      - InteractionAccess: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                instanceId:
                  type: string
                  minLength: 16
                  maxLength: 64
                  pattern: ^[A-Za-z0-9_-]+$
                  description: Journey Instance Id, a unique identifier for a started journey instance.
                text:
                  type: string
                  minLength: 1
                  maxLength: 255
                containerId:
                  type: string
                  maxLength: 255
                  pattern: ^[A-Za-z0-9|_.-]+$
                limit:
                  type: integer
                  minimum: 1
                  maximum: 25
              required:
              - instanceId
              - text
              additionalProperties: false
      responses:
        '200':
          description: Loqate search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoqateSearchResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Instance not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable — Loqate API key not configured, upstream unreachable, upstream timed out, or upstream signalled an API-level error. Inspect the `problem` field for the specific cause.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /journey/loqate/retrieve:
    post:
      tags:
      - Interaction
      summary: Retrieve full address via Loqate Capture
      description: Server-side proxy for the Loqate Capture Retrieve endpoint. Returns the full address detail for a given Loqate address ID.
      security:
      - CustomerAccess: []
      - InteractionAccess: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                instanceId:
                  type: string
                  minLength: 16
                  maxLength: 64
                  pattern: ^[A-Za-z0-9_-]+$
                  description: Journey Instance Id, a unique identifier for a started journey instance.
                addressId:
                  type: string
                  minLength: 1
                  maxLength: 255
                  pattern: ^[A-Za-z0-9|_.-]+$
              required:
              - instanceId
              - addressId
              additionalProperties: false
