openapi: 3.2.0
info:
  title: Gbg Interaction API
  version: 2.0.0
  license:
    name: MIT
  description: 'Operations tagged Interaction across 2 of this provider''s published API definitions: gbg-go-v2-openapi.json, gbg-go-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://eu.platform.go.gbgplc.com/v2/captain/
- url: https://us.platform.go.gbgplc.com/v2/captain/
- url: https://au.platform.go.gbgplc.com/v2/captain/
- url: https://api.auth.gbgplc.com/as/token.oauth2
security: []
tags:
- name: Interaction
paths:
  /journey/interaction/fetch:
    post:
      tags:
      - Interaction
      summary: Fetch current interaction
      description: Retrieves the current interaction state for a journey instance.
      security:
      - CustomerAccess: []
      - InteractionAccess: []
      parameters:
      - schema:
          type: string
          description: Response profile. Omit or 'full' for the full response (default, unchanged). 'slim' returns the compact, typed customer-facing shape. Any other value returns 400.
          example: slim
        required: false
        description: Response profile. Omit or 'full' for the full response (default, unchanged). 'slim' returns the compact, typed customer-facing shape. Any other value returns 400.
        name: view
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                instanceId:
                  type: string
                  minLength: 16
                  maxLength: 64
                  pattern: ^[A-Za-z0-9_-]+$
                  description: Journey Instance Id, a unique identifier for a started journey instance.
                scope:
                  type: string
                  enum:
                  - subject
                  - reviewer
              required:
              - instanceId
              additionalProperties: {}
      responses:
        '200':
          description: Interaction state (full by default; slim with ?view=slim)
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/InteractionFetchResponse'
                - $ref: '#/components/schemas/SlimInteractionFetchResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Instance not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: postJourneyInteractionFetch
      x-operation-id-source: derived
    servers:
    - url: https://eu.platform.go.gbgplc.com/v2/captain/
    - url: https://us.platform.go.gbgplc.com/v2/captain/
    - url: https://au.platform.go.gbgplc.com/v2/captain/
    - url: https://api.auth.gbgplc.com/as/token.oauth2
