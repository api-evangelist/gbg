  /journey/task/schema:
    post:
      operationId: getTaskSchema
      summary: Get Task Schema
      tags:
      - Customer APIs
      security:
      - CustomerAccess: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                taskId:
                  type: string
                  minLength: 16
                  maxLength: 64
                  description: Task Id, a unique identifier for a task assigned to an End User during a Journey.
              required:
              - taskId
              additionalProperties: false
            example:
              taskId: TkoviRO58Q8R7qPnAkLAqBAT
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  $schema:
                    type: string
                  type:
                    type: string
                  properties:
                    type: object
                    additionalProperties: {}
                  required:
                    type: array
                    items:
                      type: string
                required:
                - $schema
                - type
                - properties
                - required
                additionalProperties: false
              examples:
                Default:
                  value:
                    $schema: http://json-schema.org/draft-07/schema#
                    type: object
                    properties:
                      context:
                        type: object
                        properties:
                          subject:
                            type: object
                            properties:
                              identity:
                                type: object
                                properties:
                                  firstName:
                                    type: string
                                    pattern: '[A-Za-z]+'
                                    minLength: 2
                              required:
                              - firstName
                          required:
                          - identity
                      required:
                      - subject
                    required:
                    - context
        '400':
          description: Bad Request
          content:
            application/json: {}
        '401':
          description: Unauthorized
          content:
            application/json: {}
        '403':
          description: Forbidden
          content:
            application/json: {}
        '404':
          description: Not Found
          content:
            application/json: {}
        '405':
          description: Method Not Allowed
          content:
            application/json: {}
        '500':
          description: Internal Server Error
          content:
            application/json: {}
        '503':
          description: Service Unavailable
          content:
            application/json: {}
