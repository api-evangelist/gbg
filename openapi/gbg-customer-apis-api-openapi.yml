                Default:
                  value:
                    status: InProgress
                    instanceId: PiIuACmx8Q8R7qPnAkLAqBAT
                    tasks:
                    - taskId: TkoviRO58Q8R7qPnAkLAqBAT
                      schema:
                        $ref: '#/schemas/lo0698Ug9ziO7ZbrEXxjfZxHNaMiK0mn'
