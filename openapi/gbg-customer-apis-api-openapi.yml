                          type: string
                        type:
                          type: string
                        properties:
                          type: object
                          additionalProperties: {}
                        required:
                          type: array
                          items:
                            type: string
                      required:
                      - $schema
                      - type
                      - properties
                      - required
                      additionalProperties: false
                required:
                - instanceId
                - status
                - tasks
                - schemas
                additionalProperties: false
